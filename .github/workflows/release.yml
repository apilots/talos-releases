name: Build release

on:
  repository_dispatch:
    types:
      - talos_release
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to release, for example v0.1.0"
        required: true
        type: string
      publish_latest:
        description: "Move the stable latest container tag."
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: talos-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      source_ref: ${{ steps.metadata.outputs.source_ref }}
      publish_latest: ${{ steps.metadata.outputs.publish_latest }}
    steps:
      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_PUBLISH_LATEST: ${{ github.event.client_payload.publish_latest }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail

          TAG="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          PUBLISH_LATEST="${DISPATCH_PUBLISH_LATEST:-${INPUT_PUBLISH_LATEST:-true}}"

          if [[ -z "${TAG}" ]]; then
            echo "A release tag is required." >&2
            exit 1
          fi

          if [[ "${TAG}" != v* ]]; then
            echo "Release tags must use the v* format." >&2
            exit 1
          fi

          VERSION="${DISPATCH_VERSION:-${TAG#v}}"
          if [[ -z "${VERSION}" ]]; then
            echo "Release version must not be empty." >&2
            exit 1
          fi
          if [[ "${VERSION}" != "${TAG#v}" ]]; then
            echo "Release version ${VERSION} does not match tag ${TAG}." >&2
            exit 1
          fi
          if [[ "${VERSION}" == *[!A-Za-z0-9._-]* ]]; then
            echo "Release version contains unsupported characters: ${VERSION}" >&2
            exit 1
          fi
          if [[ "${PUBLISH_LATEST}" != "true" && "${PUBLISH_LATEST}" != "false" ]]; then
            echo "publish_latest must be true or false." >&2
            exit 1
          fi

          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            query_error="$(mktemp)"
            if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>"${query_error}")"; then
              [[ "${latest_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "Cannot compare latest release version: ${latest_tag}" >&2
                exit 1
              }
              newest_tag="$(printf '%s\n' "${TAG}" "${latest_tag}" | sort -V | tail -n 1)"
              if [[ "${newest_tag}" != "${TAG}" ]]; then
                PUBLISH_LATEST=false
                echo "Keeping latest on newer release ${latest_tag}."
              fi
            elif ! grep -Fq "HTTP 404" "${query_error}"; then
              cat "${query_error}" >&2
              exit 1
            fi
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "source_ref=refs/tags/${TAG}"
            echo "publish_latest=${PUBLISH_LATEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Reject an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          query_error="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >/dev/null 2>"${query_error}"; then
            echo "Release ${RELEASE_TAG} already exists; published tags are immutable." >&2
            exit 1
          fi
          if ! grep -Fq "HTTP 404" "${query_error}"; then
            cat "${query_error}" >&2
            echo "Could not verify whether release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

  validate-source:
    name: Validate source release version
    needs:
      - prepare
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout Talos source
        uses: actions/checkout@v4
        with:
          repository: apilots/talos
          ref: ${{ needs.prepare.outputs.source_ref }}
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate source tag, release, and version
        id: source
        env:
          GH_TOKEN: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "${checkout_sha}" != "${tag_sha}" ]]; then
            echo "Checked out ${checkout_sha}, but ${RELEASE_TAG} resolves to ${tag_sha}." >&2
            exit 1
          fi

          source_release="$(mktemp)"
          gh api "repos/apilots/talos/releases/tags/${RELEASE_TAG}" > "${source_release}"
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            '.tag_name == $tag
              and .draft == false
              and (.published_at | type == "string" and length > 0)
              and (.body | type == "string" and length > 0)' \
            "${source_release}" >/dev/null || {
              echo "Source release apilots/talos@${RELEASE_TAG} is not published or has empty notes." >&2
              exit 1
            }
          jq -j '.body' "${source_release}" > release-body.md

          bash scripts/check-release-version.sh "${RELEASE_VERSION}"

          echo "sha=${checkout_sha}" >> "${GITHUB_OUTPUT}"

      - name: Preserve canonical release notes
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-notes
          path: release-body.md
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Source release gate
    needs: [prepare, validate-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: apilots/talos
          ref: ${{ needs.validate-source.outputs.source_sha }}
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: apilots/talos-cloud
          path: talos-cloud
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
      - run: ln -sfn "${GITHUB_WORKSPACE}/talos-cloud" "${GITHUB_WORKSPACE}/../talos-cloud"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: talos-app/pnpm-lock.yaml
      - run: pnpm --dir talos-app install --frozen-lockfile
      - name: Run Talos release checks
        run: bash scripts/check-release.sh

  build:
    name: Build ${{ matrix.name }}
    needs:
      - prepare
      - validate-source
      - quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Desktop
            artifact_name: talos-desktop-macos
            runner: macos-26
            build_target: desktop-mac
            product_subdir: desktop-mac
          - name: Linux Desktop
            artifact_name: talos-desktop-linux-amd64
            runner: ubuntu-latest
            build_target: desktop-linux
            product_subdir: desktop-linux
          - name: Server WebUI linux-amd64
            artifact_name: talos-server-webui-linux-amd64
            runner: ubuntu-latest
            build_target: server-webui
            product_subdir: server
          - name: Server WebUI linux-arm64
            artifact_name: talos-server-webui-linux-arm64
            runner: ubuntu-24.04-arm
            build_target: server-webui
            product_subdir: server
          - name: TUI linux-amd64
            artifact_name: talos-tui-linux-amd64
            runner: ubuntu-24.04
            build_target: tui
            product_subdir: tui
          - name: TUI linux-arm64
            artifact_name: talos-tui-linux-arm64
            runner: ubuntu-24.04-arm
            build_target: tui
            product_subdir: tui
          - name: TUI macOS AMD64
            artifact_name: talos-tui-macos-amd64
            runner: macos-26-intel
            build_target: tui
            product_subdir: tui
          - name: TUI macOS ARM64
            artifact_name: talos-tui-macos-arm64
            runner: macos-26
            build_target: tui
            product_subdir: tui
    steps:
      - name: Checkout Talos source
        uses: actions/checkout@v4
        with:
          repository: apilots/talos
          ref: ${{ needs.validate-source.outputs.source_sha }}
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Talos Cloud SDK source
        uses: actions/checkout@v4
        with:
          repository: apilots/talos-cloud
          path: talos-cloud
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          fetch-depth: 1

      - name: Link Talos Cloud SDK path dependency
        run: ln -sfn "${GITHUB_WORKSPACE}/talos-cloud" "${GITHUB_WORKSPACE}/../talos-cloud"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talos-rs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: talos-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir talos-app install --frozen-lockfile

      - name: Build product
        env:
          PROFILE: release
          PRODUCT_DIR: ${{ github.workspace }}/dist/products/release
          DESKTOP_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          SERVER_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          TUI_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ./build.sh "${{ matrix.build_target }}"

      - name: Verify native TUI installation
        if: ${{ matrix.build_target == 'tui' }}
        env:
          TUI_INSTALL_PRODUCT_DIR: ${{ github.workspace }}/dist/products/release
        run: talos-e2e/run_e2e.sh --case 15_tui_install/01_native_install

      - name: Upload native installation report
        if: ${{ always() && matrix.build_target == 'tui' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-install-report-${{ matrix.artifact_name }}
          path: |
            talos-e2e/reports/e2e_report_*.md
            talos-e2e/reports/15_tui_install/01_native_install/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload product artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/products/release/${{ matrix.product_subdir }}/**
          if-no-files-found: error
          retention-days: 14

  docker-image:
    name: Build server image ${{ matrix.platform }}
    needs:
      - prepare
      - validate-source
      - quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/talos-server
    steps:
      - name: Checkout Talos source
        uses: actions/checkout@v4
        with:
          repository: apilots/talos
          ref: ${{ needs.validate-source.outputs.source_sha }}
          path: talos
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Talos Cloud SDK source
        uses: actions/checkout@v4
        with:
          repository: apilots/talos-cloud
          path: talos-cloud
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          fetch-depth: 1

      - name: Set Docker metadata
        id: docker_metadata
        env:
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail

          image_name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          revision="${SOURCE_SHA}"

          {
            echo "image_name=${image_name}"
            echo "revision=${revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: talos/build/server/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ steps.docker_metadata.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ steps.docker_metadata.outputs.revision }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${IMAGE_DIGEST#sha256:}"
          if [[ -z "${digest}" || "${digest}" == "${IMAGE_DIGEST}" ]]; then
            echo "Invalid image digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          touch "${RUNNER_TEMP}/digests/${digest}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: talos-server-image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish server image manifest
    needs:
      - prepare
      - docker-image
      - build
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/talos-server
    steps:
      - name: Set Docker metadata
        id: docker_metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          set -euo pipefail

          image_name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image_name=${image_name}"
            echo "version_tag=${RELEASE_VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "publish_latest=${PUBLISH_LATEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: talos-server-image-digests-*
          merge-multiple: true

      - name: Create multi-architecture manifest
        env:
          IMAGE_NAME: ${{ steps.docker_metadata.outputs.image_name }}
          RELEASE_TAG: ${{ steps.docker_metadata.outputs.release_tag }}
          VERSION_TAG: ${{ steps.docker_metadata.outputs.version_tag }}
          PUBLISH_LATEST: ${{ steps.docker_metadata.outputs.publish_latest }}
        run: |
          set -euo pipefail

          sources=()
          while IFS= read -r digest_file; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done < <(find "${RUNNER_TEMP}/digests" -type f | sort)
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "Expected 2 image digests, found ${#sources[@]}." >&2
            exit 1
          fi

          tags=(
            --tag "${IMAGE_NAME}:${RELEASE_TAG}"
            --tag "${IMAGE_NAME}:${VERSION_TAG}"
          )
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            tags+=(--tag "${IMAGE_NAME}:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "${sources[@]}"

          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}"

      - name: Write image metadata
        env:
          IMAGE_NAME: ${{ steps.docker_metadata.outputs.image_name }}
          RELEASE_TAG: ${{ steps.docker_metadata.outputs.release_tag }}
          VERSION_TAG: ${{ steps.docker_metadata.outputs.version_tag }}
          PUBLISH_LATEST: ${{ steps.docker_metadata.outputs.publish_latest }}
        run: |
          set -euo pipefail

          mkdir -p image-metadata
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" | awk '/^Digest:/ { print $2; exit }')"
          if [[ -z "${digest}" ]]; then
            echo "Could not resolve image digest for ${IMAGE_NAME}:${RELEASE_TAG}" >&2
            exit 1
          fi

          jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg digest "${digest}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg version_tag "${VERSION_TAG}" \
            --arg publish_latest "${PUBLISH_LATEST}" \
            '($publish_latest == "true") as $publish_latest_bool | {
              image: $image,
              digest: $digest,
              tags: ([$release_tag, $version_tag] + (if $publish_latest_bool then ["latest"] else [] end)),
              architecture_tags: [],
              platforms: ["linux/amd64", "linux/arm64"]
            }' > image-metadata/server-image.json

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: talos-server-image-metadata
          path: image-metadata/server-image.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs:
      - prepare
      - validate-source
      - build
      - docker-manifest
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout Talos source
        uses: actions/checkout@v4
        with:
          repository: apilots/talos
          ref: ${{ needs.validate-source.outputs.source_sha }}
          token: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download product artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: talos-*

      - name: Download canonical release notes
        uses: actions/download-artifact@v4
        with:
          name: canonical-release-notes
          path: .

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REPO: apilots/talos
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
        run: |
          set -euo pipefail

          mkdir -p release-assets
          install -m 755 deploy/install/install.sh release-assets/install.sh
          find downloaded -type f -print0 | while IFS= read -r -d '' file; do
            base="$(basename "${file}")"
            group="$(basename "$(dirname "${file}")")"
            dest="${base}"

            case "${base}" in
              *.AppImage|*.blockmap|*.dmg|*.tar.gz)
                ;;
              *)
                continue
                ;;
            esac

            if [[ -e "release-assets/${dest}" ]]; then
              dest="${group}-${base}"
            fi

            cp "${file}" "release-assets/${dest}"
          done

          checksums_temp="$(mktemp)"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > "${checksums_temp}"
          )
          mv "${checksums_temp}" release-assets/checksums.txt

          assets_json="$(mktemp)"
          printf '[]' > "${assets_json}"
          while read -r checksum path; do
            name="${path#./}"
            size="$(stat -c %s "release-assets/${name}")"
            url=""
            if [[ -n "${R2_PUBLIC_BASE_URL}" ]]; then
              url="${R2_PUBLIC_BASE_URL%/}/stable/${RELEASE_TAG}/${name}"
            fi

            jq \
              --arg name "${name}" \
              --arg checksum "${checksum}" \
              --arg size "${size}" \
              --arg url "${url}" \
              '. += [{
                name: $name,
                sha256: $checksum,
                size: ($size | tonumber),
                url: $url
              }]' "${assets_json}" > "${assets_json}.next"
            mv "${assets_json}.next" "${assets_json}"
          done < release-assets/checksums.txt

          server_image_json="downloaded/talos-server-image-metadata/server-image.json"
          if [[ ! -f "${server_image_json}" ]]; then
            echo "Missing server image metadata artifact: ${server_image_json}" >&2
            exit 1
          fi

          jq -n \
            --arg tag "${RELEASE_TAG}" \
            --arg version "${RELEASE_VERSION}" \
            --arg source_repo "${SOURCE_REPO}" \
            --arg source_ref "${SOURCE_REF}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg r2_base_url "${R2_PUBLIC_BASE_URL}" \
            --slurpfile assets "${assets_json}" \
            --slurpfile server_image "${server_image_json}" \
            '{
              tag: $tag,
              version: $version,
              source: {
                repository: $source_repo,
                ref: $source_ref,
                sha: $source_sha
              },
              generated_at: $generated_at,
              r2_base_url: $r2_base_url,
              assets: $assets[0],
              images: {
                server: $server_image[0]
              }
            }' > release-assets/manifest.json

      - name: Test final TUI release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: deploy/install/tests/release_assets_test.sh release-assets "${RELEASE_VERSION}"

      - name: Verify canonical release notes are unchanged
        env:
          GH_TOKEN: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          source_release="$(mktemp)"
          current_body="$(mktemp)"
          gh api "repos/apilots/talos/releases/tags/${RELEASE_TAG}" > "${source_release}"
          jq -j '.body' "${source_release}" > "${current_body}"
          cmp release-body.md "${current_body}" || {
            echo "Source release notes changed after validation; refusing to publish." >&2
            exit 1
          }

      - name: Upload release assets to R2
        if: ${{ env.R2_ACCOUNT_ID != '' && env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' && env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          VERSION_PREFIX="stable/${RELEASE_TAG}"
          LATEST_PREFIX="stable/latest"

          existing_count="$(aws s3api list-objects-v2 \
            --bucket "${R2_BUCKET}" \
            --prefix "${VERSION_PREFIX}/" \
            --max-keys 1 \
            --query KeyCount \
            --output text \
            --endpoint-url "${ENDPOINT_URL}")"
          if [[ "${existing_count}" != "0" ]]; then
            echo "R2 release prefix ${VERSION_PREFIX} already exists; published tags are immutable." >&2
            exit 1
          fi

          aws s3 sync release-assets "s3://${R2_BUCKET}/${VERSION_PREFIX}/" \
            --endpoint-url "${ENDPOINT_URL}"

          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            aws s3 cp "release-assets/manifest.json" "s3://${R2_BUCKET}/${LATEST_PREFIX}/manifest.json" \
              --endpoint-url "${ENDPOINT_URL}"
            aws s3 cp "release-assets/checksums.txt" "s3://${R2_BUCKET}/${LATEST_PREFIX}/checksums.txt" \
              --endpoint-url "${ENDPOINT_URL}"
            aws s3 cp "release-assets/install.sh" "s3://${R2_BUCKET}/${LATEST_PREFIX}/install.sh" \
              --endpoint-url "${ENDPOINT_URL}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Talos ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          overwrite_files: false
          make_latest: ${{ needs.prepare.outputs.publish_latest }}
          files: release-assets/*
          body_path: release-body.md

      - name: Verify mirrored release notes
        env:
          GH_TOKEN: ${{ secrets.TALOS_SOURCE_READ_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          source_release="$(mktemp)"
          published_release="$(mktemp)"
          source_body="$(mktemp)"
          published_body="$(mktemp)"
          gh api "repos/apilots/talos/releases/tags/${RELEASE_TAG}" > "${source_release}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${published_release}"
          jq -j '.body' "${source_release}" > "${source_body}"
          jq -j '.body' "${published_release}" > "${published_body}"
          cmp "${source_body}" "${published_body}"
